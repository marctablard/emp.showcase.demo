name: SonarQube scan
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarqube-scan:
    name: SonarQube scan
    # Dependabot-triggered PR runs do not receive Actions secrets (SONAR_LOGIN would be empty → 401), so skip them.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: emporix-showcase

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
          SONAR_HOST_URL: 'https://sonarqube.k8s-tech.emporix.io'
        with:
          args: >
            -Dsonar.projectKey=${{ env.PROJECT_NAME }}
