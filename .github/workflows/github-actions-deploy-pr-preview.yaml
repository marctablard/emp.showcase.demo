# e2e Test are currently not working (Michael Feige is checking why)
# Thats why all e2e related steps are commented out
# The following steps are affected:
# - Install Playwright Browsers
# - Generate files
# - Run e2e
# - Upload e2e report
# As soon as e2e tests are working again, we will uncomment the steps

name: Deploy PR preview

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SHOWCASEDEV_PROJECT_ID }}

jobs:
  build_and_deploy_pr_preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Align npm with packageManager
        run: npm install -g "$(node -p 'const packageManager = require("./package.json").packageManager; if (!packageManager?.startsWith("npm@")) throw new Error("Expected packageManager to start with npm@"); packageManager')"
      - name: Setup safe-chain
        run: |
          npm i -g @aikidosec/safe-chain
          safe-chain setup-ci
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Install dependencies
        run: npm ci
      # - name: Install Playwright Browsers
      #   run: npx playwright install --with-deps
      - name: Pull Vercel environment information
        run: vercel env pull .env --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Generate files
        run: npm run generate
      - name: Run lint
        run: npm run lint
      - name: Run jest
        run: npm run jest
        env:
          DOTENV_CONFIG_PATH: .env
          NEXT_PUBLIC_EMPORIX_BASE_URL: https://api.emporix.io
          NEXT_EMPORIX_TEST_TENANT: ${{ vars.NEXT_EMPORIX_TEST_TENANT }}
          NEXT_EMPORIX_TEST_CLIENT_ID: ${{ vars.NEXT_EMPORIX_TEST_CLIENT_ID }}
          NEXT_EMPORIX_TEST_CLIENT_SECRET: ${{ secrets.NEXT_EMPORIX_TEST_CLIENT_SECRET }}
          NEXT_PUBLIC_BATTERY_INCLUDED_API_KEY: ${{ secrets.NEXT_PUBLIC_BATTERY_INCLUDED_API_KEY }}
          NEXT_PUBLIC_BATTERY_INCLUDED_COLLECTION: ${{ vars.NEXT_PUBLIC_BATTERY_INCLUDED_COLLECTION }}
      - name: Debug checkout contents
        if: failure()
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          git status -sb
          git ls-files src/platform/services/site/impl/EmporixSiteService.test.ts
      # - name: Run e2e
      #   run: npm run e2e
      # - name: Upload playwright report
      #   uses: actions/upload-artifact@v4
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 7
      - name: Deploy preview
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --force --token=${{ secrets.VERCEL_TOKEN }})
          DEPLOY_STATUS=$?
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://.*vercel.app')
          echo "deploy_status=$DEPLOY_STATUS" >> $GITHUB_OUTPUT
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deploy.outputs.preview_url }}
          environment: 'preview'

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deploy.outputs.preview_url }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deploy.outputs.preview_url }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'

      - name: Find Comment
        if: steps.deploy.outputs.deploy_status == '0' && steps.deploy.outputs.preview_url != ''
        uses: peter-evans/find-comment@v2
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Vercel Preview Deployment'

      - name: Create or Update Comment
        if: steps.deploy.outputs.deploy_status == '0' && steps.deploy.outputs.preview_url != ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Vercel Preview Deployment
            ✅ Deployment successfully completed!

            🔍 Preview: [${{ steps.deploy.outputs.preview_url }}](${{ steps.deploy.outputs.preview_url }})

            _Deployed with GitHub Actions at ${{ github.event.pull_request.updated_at }}_
          edit-mode: replace
