name: Deploy showcaseqadev
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SHOWCASEQADEV_PROJECT_ID }}

jobs:
  build_and_deploy_showcaseqadev:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm i -g @aikidosec/safe-chain vercel

      - name: Setup safe-chain
        run: safe-chain setup-ci

      - name: Pull Vercel environment
        run: vercel env pull .env --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate files
        run: npm run generate

      - name: Run lint
        run: npm run lint

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --force --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
