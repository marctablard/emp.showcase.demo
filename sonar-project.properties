# SonarQube scanner configuration.
#
# Until this file existed the scan ran entirely on defaults, which meant
# `sonar.sources` fell back to the project base directory and `sonar.tests`
# was never set at all — so every `*.test.ts(x)` file was indexed as
# production code. That is what turned deliberate XSS negative tests (the
# `javascript:` payloads that `sanitize-href` and the CMS renderers are
# tested against) into Security Hotspots on the PR quality gate.
#
# The scan workflow (.github/workflows/sonarqube-scan.yml) still passes
# -Dsonar.projectKey on the command line; CLI properties win over this file,
# so the key below only matters for local scans.
sonar.projectKey=emporix-showcase

# --- Source / test split -------------------------------------------------
# `sonar.sources` and `sonar.tests` share the same base directory, so the two
# sets MUST stay disjoint or the scanner aborts with "File can't be indexed
# twice": `sonar.exclusions` removes the test files from main code, and
# `sonar.test.inclusions` picks up exactly the same set as test code. Keep
# both lists in sync when adding a test-file pattern.
sonar.sources=.
sonar.tests=.
sonar.exclusions=node_modules/**,.next/**,coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,e2e/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,e2e/**

# --- Narrowly-scoped rule exclusions -------------------------------------
# Both entries below suppress a rule that is factually wrong for this repo,
# not one that is merely inconvenient. Do not broaden either resourceKey to
# work around an unrelated finding.
sonar.issue.ignore.multicriteria=e1,e2

# e1 — S4662 ("at-rules" should be valid) does not know Tailwind v4's at-rule
# vocabulary. src/app/globals.css legitimately uses @custom-variant, @theme,
# @theme inline and @utility; all of them are valid Tailwind v4 syntax
# compiled away at build time. Without this, every PR that adds or touches a
# Tailwind at-rule drops the Reliability rating on new code to C.
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.css

# e2 — S6505 flags `npm ci` without --ignore-scripts. Lifecycle scripts are
# required here and their omission is deliberate: @swc/core (which drives both
# the Next build and jest), @parcel/watcher and unrs-resolver link their
# native binaries from a postinstall, so disabling scripts breaks the build
# the workflows exist to run. The rule key is wildcarded because the analyzer
# repository differs per file type. Supply-chain protection for these
# installs comes from safe-chain (malware blocking + minimum package age),
# not from --ignore-scripts.
sonar.issue.ignore.multicriteria.e2.ruleKey=*:S6505
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/**
