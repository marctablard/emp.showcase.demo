Services:
  SearchService: BatteryIncludedSearchService
  ProductService: EmporixProductService
  CMSService: DelegatingCmsServiceSSR

Integrations:
  EmporixProductApi: EmporixProductApi
# Service IDs that must survive `DI_PRUNE` even though the static analyzer cannot
# trace them in source. Used for IDs sourced from environment variables (e.g.
# NEXT_SETUP_STEP_SERVICES read by src/app/api/setup/route.ts) or other runtime
# configuration. Listed services and their transitive @inject deps stay in the bundle.
AlwaysInclude:
  Server:
    - EmporixSetupService
    - FileBasedSetupService
  Client: []
  SSR: []

# Files whose container lookups resolve the service ID at runtime, so `DI_PRUNE` cannot
# trace them. Listing a file acknowledges that every ID it can reach is pinned above under
# AlwaysInclude. Any unlisted dynamic lookup fails `generate:prod` instead of being silently
# pruned — set DI_PRUNE_ALLOW_DYNAMIC=true to downgrade that to a warning while iterating.
AllowDynamicLookups:
  - src/app/api/setup/route.ts
